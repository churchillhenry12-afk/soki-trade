[project]
name = "qforge"
version = "0.1.0"
description = "Soki Trade general-purpose operations agent with trading research tools"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "celery>=5.5,<6",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "qrcode>=8,<9",
  "sqlalchemy>=2.0,<3",
  "structlog>=25.4,<26",
  "textual>=6,<7",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pandas-stubs>=2.2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-qrcode>=8,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["packages/shared/src", "apps/api/src", "apps/terminal-tui/src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["packages/shared/src", "apps/api/src", "apps/terminal-tui/src"]
plugins = ["pydantic.mypy"]
exclude = ["infrastructure/migrations"]

[tool.setuptools]
package-dir = {"" = "packages/shared/src"}

[tool.setuptools.packages.find]
where = ["packages/shared/src"]
